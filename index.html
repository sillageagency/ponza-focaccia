<style>
  :root{
    --green:#0f5c2e; --green-deep:#0a4322; --cream:#f6f1df;
    --cream-card:#fbf8ee; --ink:#123a24; --muted:#4a6b54;
    /* pile de polices : Poppins pour le latin, puis polices systeme
       qui couvrent le cyrillique et les caracteres CJK (japonais / chinois) */
    --stack:'Poppins','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',
            'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--stack);background:var(--cream);color:var(--ink);line-height:1.5;padding-bottom:60px;}
  header{background:var(--green);color:var(--cream);text-align:center;padding:30px 20px 20px;border-bottom:5px solid var(--green-deep);}
  header .brand{font-family:'Pacifico',cursive;font-size:2.6rem;line-height:1.05;letter-spacing:.5px;}
  header .wave{width:120px;height:14px;margin:12px auto 8px;display:block;}
  header .slogan{font-family:'Pacifico',cursive;font-size:1.15rem;opacity:.9;transform:rotate(-4deg);display:inline-block;margin-top:4px;}
  /* selecteur de langue : 8 langues, boutons compacts */
  .langbar{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:16px;max-width:420px;margin-left:auto;margin-right:auto;}
  .langbar button{font-family:var(--stack);font-size:.75rem;font-weight:600;cursor:pointer;background:transparent;color:var(--cream);border:1.5px solid rgba(246,241,223,.4);border-radius:999px;padding:5px 10px;display:flex;align-items:center;gap:4px;transition:.15s;}
  .langbar button .flag{font-size:.95rem;line-height:1;}
  .langbar button.active{background:var(--cream);color:var(--green-deep);border-color:var(--cream);}
  nav{position:sticky;top:0;z-index:20;background:var(--green-deep);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;box-shadow:0 3px 10px rgba(0,0,0,.15);}
  nav::-webkit-scrollbar{display:none;}
  nav a{flex:0 0 auto;color:var(--cream);text-decoration:none;font-size:.82rem;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid rgba(246,241,223,.35);white-space:nowrap;transition:.15s;}
  nav a:active{background:var(--cream);color:var(--green-deep);}
  main{max-width:640px;margin:0 auto;padding:8px 16px 24px;}
  section{padding-top:26px;scroll-margin-top:64px;}
  .sec-title{font-family:'Pacifico',cursive;color:var(--green);font-size:1.9rem;margin-bottom:2px;}
  .sec-sub{color:var(--muted);font-size:.85rem;margin-bottom:14px;font-style:italic;}
  .item{background:var(--cream-card);border:1.5px solid rgba(15,92,46,.15);border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 0 rgba(15,92,46,.05);}
  .item-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .item-name{font-weight:600;font-size:1.05rem;color:var(--green-deep);}
  .item-price{font-weight:700;color:var(--green);white-space:nowrap;font-size:1rem;}
  .item-desc{font-size:.86rem;color:var(--muted);margin-top:3px;}
  .compact .item{padding:10px 15px;margin-bottom:7px;}
  .compact .item-desc{margin-top:1px;}
  .compose-price{text-align:center;font-family:'Pacifico',cursive;color:var(--green);font-size:1.5rem;margin:-4px 0 14px;}
  .compose-grid{display:grid;gap:10px;}
  .compose-card{background:var(--cream-card);border:1.5px solid rgba(15,92,46,.15);border-radius:14px;padding:13px 15px;}
  .compose-card h3{font-family:'Pacifico',cursive;color:var(--green);font-size:1.15rem;font-weight:400;margin-bottom:6px;}
  .compose-card p{font-size:.88rem;color:var(--ink);}
  footer{text-align:center;padding:30px 20px 10px;color:var(--muted);}
  footer .big{font-family:'Pacifico',cursive;color:var(--green);font-size:1.8rem;transform:rotate(-3deg);display:inline-block;}
  footer p{margin-top:10px;font-size:.8rem;}


  /* ---------- Numeros des ingredients (compose) ---------- */
  .compose-hint{background:var(--green);color:var(--cream);border-radius:12px;padding:11px 14px;
    font-size:.86rem;line-height:1.45;margin:-4px 0 14px;}
  .compose-hint b{font-weight:700;}
  .ing-list{display:flex;flex-wrap:wrap;gap:6px;}
  .ing{display:inline-flex;align-items:center;gap:6px;background:#fff;
    border:1px solid rgba(15,92,46,.18);border-radius:9px;padding:5px 9px;font-size:.85rem;color:var(--ink);}
  .ing b{background:var(--green);color:var(--cream);border-radius:5px;padding:1px 6px;
    font-size:.74rem;font-weight:700;letter-spacing:.4px;font-variant-numeric:tabular-nums;}
  .ing i{font-style:normal;color:var(--green);font-weight:600;font-size:.78rem;}

  /* ---------- Photos des produits ---------- */
  .item.has-photo{display:flex;gap:12px;align-items:flex-start;}
  .item-thumb{width:80px;height:80px;flex:0 0 80px;border-radius:10px;object-fit:cover;
    background:#e7e3d3;cursor:zoom-in;display:block;}
  .item-body{flex:1;min-width:0;}
  .compact .item.has-photo{padding:10px 12px;}
  .compact .item-thumb{width:64px;height:64px;flex:0 0 64px;}

  /* ---------- Bloc boissons signature ---------- */
  .signature{background:var(--green);border-radius:16px;overflow:hidden;margin-bottom:16px;
    box-shadow:0 4px 14px rgba(10,67,34,.18);}
  .signature-img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;cursor:zoom-in;background:var(--green-deep);}
  .signature-body{padding:14px 16px 16px;color:var(--cream);}
  .signature-kicker{font-size:.68rem;letter-spacing:1.4px;text-transform:uppercase;opacity:.85;font-weight:600;}
  .signature-title{font-family:'Pacifico',cursive;font-size:1.45rem;margin:2px 0 8px;line-height:1.15;}
  html[data-script="nonlatin"] .signature-title{font-family:var(--stack);font-weight:700;font-size:1.2rem;}
  .signature-list{display:grid;gap:7px;}
  .signature-item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    background:rgba(246,241,223,.12);border-radius:9px;padding:8px 11px;}
  .signature-item .n{font-weight:600;font-size:.95rem;}
  .signature-item .p{font-weight:700;white-space:nowrap;}
  .signature-note{font-size:.76rem;opacity:.85;margin-top:9px;font-style:italic;}
  html[data-script="nonlatin"] .signature-note{font-style:normal;}

  /* ---------- Agrandissement au clic ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(8,26,16,.94);display:none;
    align-items:center;justify-content:center;z-index:100;padding:18px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:84vh;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .lightbox .close{position:absolute;top:14px;right:16px;color:var(--cream);font-size:1.9rem;
    line-height:1;background:none;border:none;cursor:pointer;padding:6px 10px;}
  .top-link{display:block;text-align:center;margin:18px auto 0;color:var(--green);font-size:.8rem;text-decoration:none;font-weight:600;}

  /* --- Pacifico ne contient ni cyrillique ni CJK : on bascule les titres
         traduits sur la pile systeme pour RU / JA / ZH --- */
  html[data-script="nonlatin"] .sec-title{
    font-family:var(--stack);font-weight:700;font-size:1.55rem;letter-spacing:.2px;
  }
  html[data-script="nonlatin"] .compose-card h3{
    font-family:var(--stack);font-weight:700;font-size:1.02rem;
  }
  html[data-script="nonlatin"] .compose-price{font-family:var(--stack);font-weight:700;font-size:1.35rem;}
  html[data-script="nonlatin"] .sec-sub{font-style:normal;}
</style>

let currentLang = "fr";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function render(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dataset.script = NONLATIN.includes(lang) ? "nonlatin" : "latin";

  document.querySelectorAll("#langbar button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang===lang);
  });

  const nav = document.getElementById("nav");
  nav.innerHTML = '<a href="#top">↑</a>' + SECTIONS.map(s=>`<a href="#${s.id}">${esc(t(s.nav,lang))}</a>`).join("");

  const menu = document.getElementById("menu");
  let html = '<span id="top"></span>';
  for(const s of SECTIONS){
    html += `<section id="${s.id}">`;
    html += `<div class="sec-title">${esc(t(s.title,lang))}</div>`;
    if(s.sub) html += `<div class="sec-sub">${esc(t(s.sub,lang))}</div>`;
    if(s.cards){
      html += `<div class="compose-price">${esc(s.price)}</div>`;
      if(s.hint) html += `<div class="compose-hint">${esc(t(s.hint,lang))}</div>`;
      html += `<div class="compose-grid">`;
      for(const c of s.cards){
        html += `<div class="compose-card"><h3>${esc(t(c.h,lang))}</h3><div class="ing-list">`;
        for(const it of c.items){
          html += `<span class="ing"><b>${it.num}</b>${esc(t(it.n,lang))}${it.supp?' <i>+1 €</i>':''}</span>`;
        }
        html += `</div></div>`;
      }
      html += `</div>`;
    } else {
      if(s.id === "soft") html += signatureBlock(lang);
      html += s.compact ? '<div class="compact">' : '';
      for(const it of s.items){
        const name = t(it.n,lang);
        const file = PHOTOS[typeof it.n === "string" ? it.n : (it.n.fr||"")];
        const inner = `<div class="item-row"><span class="item-name">${esc(name)}</span><span class="item-price">${esc(it.p)}</span></div>`
                    + (it.d ? `<div class="item-desc">${esc(t(it.d,lang))}</div>` : "");
        if(file){
          html += `<div class="item has-photo"><img class="item-thumb" loading="lazy" decoding="async" `
                + `src="${PHOTO_DIR}${file}" data-file="${file}" alt="${esc(name)}"><div class="item-body">${inner}</div></div>`;
        } else {
          html += `<div class="item">${inner}</div>`;
        }
      }
      html += s.compact ? '</div>' : '';
    }
    html += `</section>`;
  }
  html += `<a href="#top" class="top-link">${esc(t(UI.backTop,lang))}</a>`;
  menu.innerHTML = html;
  document.getElementById("footer-note").textContent = t(UI.footer,lang);
  setupPhotos();
}


function signatureBlock(lang){
  const s = SIGNATURE;
  let h = `<div class="signature">`;
  h += `<img class="signature-img" loading="lazy" decoding="async" src="${PHOTO_DIR}${s.photo}" data-file="${s.photo}" alt="${esc(t(s.title,lang))}">`;
  h += `<div class="signature-body">`;
  h += `<div class="signature-kicker">${esc(t(s.kicker,lang))}</div>`;
  h += `<div class="signature-title">${esc(t(s.title,lang))}</div>`;
  h += `<div class="signature-list">`;
  for(const it of s.items){
    h += `<div class="signature-item"><span class="n">${esc(t(it.n,lang))}</span><span class="p">${esc(it.p)}</span></div>`;
  }
  h += `</div><div class="signature-note">${esc(t(s.note,lang))}</div></div></div>`;
  return h;
}

/* Repli en cascade : on cherche la photo dans "photos/", puis a la racine du site.
   Si elle est introuvable, on retire l'image sans casser la mise en page. */
function attachFallback(img, abandon){
  img.addEventListener("error", ()=>{
    if(!img.dataset.retried && img.dataset.file){
      img.dataset.retried = "1";
      img.src = img.dataset.file;      // 2e essai : fichier a la racine
      return;
    }
    abandon();
  });
}
function setupPhotos(){
  document.querySelectorAll(".item-thumb").forEach(img=>{
    attachFallback(img, ()=>{
      const card = img.closest(".item");
      const body = card && card.querySelector(".item-body");
      if(card && body){ card.classList.remove("has-photo"); card.innerHTML = body.innerHTML; }
    });
  });
  const sig = document.querySelector(".signature-img");
  if(sig) attachFallback(sig, ()=> sig.remove());
}

/* Agrandissement au clic */
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lb-img");
function closeLb(){ lb.classList.remove("open"); lbImg.removeAttribute("src"); }
document.getElementById("lb-close").addEventListener("click", closeLb);
lb.addEventListener("click", e=>{ if(e.target === lb) closeLb(); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeLb(); });
document.addEventListener("click", e=>{
  const img = e.target.closest(".item-thumb, .signature-img");
  if(!img || !img.getAttribute("src")) return;
  lbImg.src = img.src; lb.classList.add("open");
});

const langbar = document.getElementById("langbar");
langbar.innerHTML = LANGS.map(l=>`<button data-lang="${l.code}" aria-label="${l.code}"><span class="flag">${l.flag}</span>${l.label}</button>`).join("");
langbar.querySelectorAll("button").forEach(b=>{ b.addEventListener("click",()=>render(b.dataset.lang)); });

const supported = LANGS.map(l=>l.code);
const nav0 = (navigator.language||"fr").slice(0,2).toLowerCase();
render(supported.includes(nav0) ? nav0 : "fr");
</script>
